<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Live futsal slot availability — book on WhatsApp.">

  <!-- Open Graph / WhatsApp / Facebook link preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Book My Game · Live schedule">
  <meta property="og:description" content="See free futsal slots for the next 7 days. Tap a slot to book on WhatsApp.">
  <meta property="og:image" content="https://book-my-game-a9b76.web.app/icons/Icon-512.png">
  <meta property="og:url" content="https://book-my-game-a9b76.web.app">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Book My Game · Live schedule">
  <meta name="twitter:description" content="See free futsal slots for the next 7 days. Tap a slot to book on WhatsApp.">
  <meta name="twitter:image" content="https://book-my-game-a9b76.web.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Book My Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Book My Game · Live schedule</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          // Force CanvasKit on all platforms. The HTML renderer that Flutter
          // picks by default on iOS Safari fails to load the Material Icons
          // font, leaving icon buttons blank.
          engineInitializer.initializeEngine({
            renderer: 'canvaskit',
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
